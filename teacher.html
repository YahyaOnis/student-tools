<style>
* { box-sizing: border-box; }

body {

  line-height: 1.6;

header {

  color: white;
  text-align: center;
  padding: 30px 15px;
}

h1 { margin: 0; }

.container {
  max-width: 950px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 18px;
  margin-bottom: 20px;
  box-shadow: 0 5px 18px #00000012;
}

h2 { margin-top: 0; }

select, input {
  width: 100%;
  padding: 12px;
  font: inherit;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  margin: 8px 0 15px;
}

button {
  background: #2856ce;
  color: white;
  padding: 12px 19px;
  border: 0;
  border-radius: 9px;
  cursor: pointer;
  font: inherit;
  font-weight: bold;
}

button:hover { background: #183f9d; }

button:focus-visible, select:focus-visible {
  outline: 3px solid #ffbc42;
  outline-offset: 3px;
}

.choices, .subjects {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin: 16px 0;
}

.subjects { grid-template-columns: repeat(3, 1fr); }

.choice, .subject {
  background: #edf2ff;
  color: #173c91;
  border: 2px solid #cbd8ff;
  min-height: 55px;
}

.choice:hover, .subject:hover {

}

.subject.active {
  background: #2856ce;
  color: white;
  border-color: #2856ce;
}

.teacher {
  display: flex;
  gap: 15px;
  align-items: center;
  background: #eaf9f0;
  padding: 18px;
  border-radius: 14px;
  margin-bottom: 20px;
}

.robot { font-size: 40px; }

.question {
  font-size: 23px;
  font-weight: bold;
  text-align: center;
  margin: 22px 0;
}

.feedback {
  padding: 15px;
  border-radius: 10px;
  background: #edf2ff;
  margin-top: 15px;
  min-height: 55px;
}

.correct { background: #ddf8e7; color: #176332; }
.wrong { background: #fff0dd; color: #8a4900; }

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.secondary { background: #64748b; }

.score {
  font-weight: bold;
  color: #2856ce;
}

.small { color: #62718a; font-size: 14px; }

footer {
  text-align: center;
  color: #62718a;
  padding: 25px;
}

@media(max-width: 550px) {
  .subjects { grid-template-columns: 1fr; }
  .choices { grid-template-columns: 1fr 1fr; }
  .card { padding: 18px; }
}

[dir="rtl"] .teacher {
  flex-direction: row-reverse;
}
</style>
</head>

const random = max => Math.floor(Math.random() * max);

// GENERATE MATH QUESTIONS BY GRADE
function makeMathQuestion() {
  let a, b, answer, expression, explanation;
  const level = Math.min(grade + Math.floor(attempts / 6), 8);

  if (level === 1) {
    a = 1 + random(9);
    b = 1 + random(10 - a);
    answer = a + b;
    expression = `${a} + ${b} = ?`;
    explanation = `${a} + ${b} = ${answer}`;
  } else if (level === 2) {
    a = 5 + random(16);
    b = random(a + 1);
    answer = a - b;
    expression = `${a} − ${b} = ?`;
    explanation = `${a} − ${b} = ${answer}`;
  } else if (level === 3) {
    a = 2 + random(9);
    b = 2 + random(9);
    answer = a * b;
    expression = `${a} × ${b} = ?`;
    explanation = `${a} × ${b} = ${answer}`;
  } else if (level === 4) {
    b = 2 + random(10);
    answer = 2 + random(10);
    a = b * answer;
    expression = `${a} ÷ ${b} = ?`;
    explanation = `${a} ÷ ${b} = ${answer}`;
  } else if (level === 5) {
    a = 10 + random(91);
    b = 10 + random(91);
    answer = a + b;
    expression = `${a} + ${b} = ?`;
    explanation = `${a} + ${b} = ${answer}`;
  } else {
    a = 2 + random(10);
    b = 2 + random(10);
    answer = a * b;
    expression = `${a} × ${b} = ?`;
    explanation = `${a} × ${b} = ${answer}`;
  }

  // Create four distinct answer choices.
  const choices = [answer];
  let offset = 1;

  while (choices.length < 4) {
    const candidate = answer + offset * (offset % 2 ? 1 : -1);
    if (candidate >= 0 && !choices.includes(candidate)) {
      choices.push(candidate);
    }
    offset++;
  }

  // Shuffle the choices.
  for (let i = choices.length - 1; i > 0; i--) {
    const j = random(i + 1);
    [choices[i], choices[j]] = [choices[j], choices[i]];
  }

  return {
    question: expression,
    choices: choices.map(String),
    correct: choices.indexOf(answer),
    hint: explanation
  };
}

    nextButton: t.next,
    aboutTitle: t.aboutTitle,
    aboutText: t.about,
    calculatorLink: t.calculators,
    footerNote: t.footer,
    scoreNote: t.tip

  Object.entries(labels).forEach(([id, value]) => {

  });

  for (let i = 0; i < 6; i++) {

  points = 0;
  attempts = 0;
  generateQuestion();
}

// SWITCH SUBJECT
function changeSubject(nextSubject) {
  subject = nextSubject;
  points = 0;
  attempts = 0;

  document.querySelectorAll(".subject")
    .forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.subject === subject
      );
    });

  generateQuestion();
}

    $("lessonExplanation").textContent = t.mathExplain;

    const data = lessons[subject][grade - 1][lang];

    current = {
      question: data[0],
      choices: data[1],
      correct: data[2],
      hint: data[3]
    };

    $("lessonTitle").textContent =
      subject === "reading"
      ? t.readingLesson
      : t.scienceLesson;

    $("lessonExplanation").textContent =
      subject === "reading"
      ? t.readingExplain

  $("question").textContent = current.question;
  $("feedback").textContent = t.choose;
  $("feedback").className = "feedback";
  $("choices").replaceChildren();

  current.choices.forEach((choice, index) => {
    const button = document.createElement("button");
    button.className = "choice";
    button.type = "button";
    button.textContent = choice;
    button.addEventListener("click", () => {
      checkAnswer(index);
    });
    $("choices").appendChild(button);
  });

  updateScore();
}

// CHECK ANSWER
function checkAnswer(index) {
  const t = translations[lang];

  if (solved) return;

  if (index === current.correct) {
    solved = true;
    points++;
    $("feedback").textContent = t.correct;
    $("feedback").className = "feedback correct";

    $("choices").querySelectorAll("button")
      .forEach(button => button.disabled = true);
  } else {
    $("feedback").textContent = t.wrong;
    $("feedback").className = "feedback wrong";
  }

  updateScore();
}

// DISPLAY HINT
function showHint() {
  $("feedback").textContent = current.hint;
  $("feedback").className = "feedback";
}

// NEXT QUESTION
function nextQuestion() {
  attempts++;
  generateQuestion();
}

// SCORE TRACKER
function updateScore() {
  $("score").textContent =
    translations[lang].score + ": " + points;
}

// EVENTS
$("language").addEventListener("change", updateLanguage);

$("grade").addEventListener("change", () => {
  grade = Number($("grade").value);
  points = 0;
  attempts = 0;
  generateQuestion();
});

document.querySelectorAll(".subject")
  .forEach(button => {
    button.addEventListener("click", () =>
      changeSubject(button.dataset.subject)
    );
  });

$("hintButton").addEventListener("click", showHint);
$("nextButton").addEventListener("click", nextQuestion);

// START WEBSITE
updateLanguage();

</script>
</body>
</html>
